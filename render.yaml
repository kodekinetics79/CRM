# Wimblo SaaS promotion Blueprint.
#
# This file is deliberately non-activating: both services keep auto-deploy off.
# Applying it would repurpose the existing Wimblo_CRM web service and create a
# paid background worker. Do not apply it until the cost, proxy allowlist,
# database-role/migration, object-storage, and rollback gates in the operations
# runbook are approved and complete.

envVarGroups:
  - name: wimblo-saas-production
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: NODE_ENV
        value: production
      - key: WIMBLO_RUNTIME
        value: saas
      - key: APP_ORIGIN
        sync: false
      - key: TRUSTED_PROXY_PROVIDER
        value: render
      - key: DATABASE_URL
        sync: false
      - key: CONTROL_DATABASE_URL
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
      - key: SESSION_COOKIE_NAME
        value: wimblo_session
      - key: DB_POOL_MAX
        value: "2"
      - key: JOB_CONCURRENCY
        value: "2"
      - key: JOB_LEASE_MS
        value: "30000"
      - key: DOCUMENT_STORAGE_PROVIDER
        value: neon
      - key: DOCUMENT_STORAGE_BUCKET
        sync: false
      - key: DOCUMENT_STORAGE_NAMESPACE
        value: wimblo-production
      - key: DOCUMENT_STORAGE_PRIVATE_CONFIRMED
        sync: false
      - key: AWS_REGION
        value: us-east-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: BACKUP_STORAGE_PROVIDER
        value: neon
      - key: BACKUP_STORAGE_BUCKET
        sync: false
      - key: BACKUP_STORAGE_NAMESPACE
        value: wimblo-backups
      - key: BACKUP_STORAGE_PRIVATE_CONFIRMED
        sync: false
      - key: BACKUP_AWS_REGION
        value: us-east-1
      - key: BACKUP_AWS_ENDPOINT_URL_S3
        sync: false

services:
  # Existing paid evaluator service. Applying this definition is the production
  # cutover and must happen only after a rollback commit/deploy is recorded.
  - type: web
    name: Wimblo_CRM
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    autoDeploy: false
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:saas:web
    healthCheckPath: /health
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: wimblo-saas-production
      - key: PROCESS_ROLE
        value: web
      # The application validates Render's injected hostname before enabling its
      # provider-specific edge profile. No wildcard CIDR or guessed hop count.

  # Render does not offer free background workers. This service adds at least
  # the provider's current 0.5c-512mb worker charge when created.
  - type: worker
    name: Wimblo_CRM_Worker
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    autoDeploy: false
    buildCommand: npm ci --omit=dev
    startCommand: npm run start:saas:worker
    maxShutdownDelaySeconds: 60
    envVars:
      - fromGroup: wimblo-saas-production
      - key: PROCESS_ROLE
        value: worker
